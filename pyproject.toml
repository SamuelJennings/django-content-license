[project]
name = "django-content-license"
version = "0.3.0"
description = "Store license information alongside your Django data models"
authors = [{ name = "Sam Jennings" }]
license = "MIT"
readme = "README.md"
requires-python = ">=3.11,<4.0"
keywords = ["django", "research", "science", "datasets", "research management", "open source", "open science", "FAIR"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Framework :: Django :: 5.2",
    "Framework :: Django :: 6.0",
    "Framework :: Django :: 6.1",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Natural Language :: English",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
# Actively supported Django releases only (CONSTITUTION.md Article XII).
dependencies = ["django>=5.2"]

[project.urls]
Homepage = "https://github.com/SamuelJennings/django-content-license"

[dependency-groups]
# The shared dev and test toolchain. It needs Python 3.12, while the package
# itself supports 3.11 (Article XII); dev tooling never ships to consumers.
dev = ["mvp-shared[dev,test]; python_version >= '3.12'"]

[tool.uv.sources]
mvp-shared = { git = "https://github.com/django-mvp/shared.git", tag = "v0.6.0" }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["licensing"]

# Hatchling's default sdist is the whole working tree; this keeps it to the
# package, readme, licence and authors file (hatchling adds .gitignore itself).
[tool.hatch.build.targets.sdist]
include = ["/licensing", "/README.md", "/LICENSE", "/AUTHORS.md"]

[tool.mypy]
files = ["licensing"]
disallow_untyped_defs = "False"
disallow_any_unimported = "False"
ignore_missing_imports = "True"
no_implicit_optional = "True"
check_untyped_defs = "False"
warn_return_any = "True"
warn_unused_ignores = "True"
show_error_codes = "True"
exclude = ["docs/","migrations/","tests/settings.py"]
mypy_path = "licensing/"
plugins = ["mypy_django_plugin.main"]

[tool.django-stubs]
django_settings_module = "tests.settings"
ignore_missing_model_attributes = "True"

[tool.ruff]
extend = "ruff-base.toml"

[tool.ruff.lint]
extend-ignore = [
    # Use of mark_safe (attribution HTML is escaped via the template layer)
    "S308",
    # Standard pseudo-random generators
    "S311",
]

[tool.ruff.lint.per-file-ignores]
# Tests: asserts, hardcoded test passwords, blind-exception asserts, builtin
# shadowing (`license` fixtures), unused unpacked vars — style rules that don't
# pay for themselves in tests, which the pre-commit hooks exclude anyway.
"tests/*" = ["S101", "S105", "B017", "A001", "RUF059"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "tests.settings"
pythonpath = [".", "tests"]
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py", "tests.py", "*_tests.py"]
addopts = [
    "--strict-markers",
    "--strict-config",
    "--verbose",
    "--tb=short",
    "--cov=licensing",
    "--cov-report=html",
    "-ra",
]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests as integration tests",
    "unit: marks tests as unit tests",
]

filterwarnings = [
    "ignore",
    "ignore::DeprecationWarning",
    "ignore::PendingDeprecationWarning",
    # Later entries win over "ignore". Tests that reuse a throwaway model name
    # silently replace each other's registry entry, so the warning is fatal.
    "error:Model '.*' was already registered:RuntimeWarning",
]

[tool.coverage.report]
skip_empty = true
show_missing = true

[tool.coverage.run]
branch = "true"
source = ["licensing"]


[tool.deptry]
extend_exclude = [
    "tasks.py",
    "tests/",
    "example/",
    "docs/",
]

[tool.deptry.per_rule_ignores]
DEP003 = ["licensing"]
