# Pre-commit configuration, following django-mvp/shared
# templates/pre-commit-config.yaml @ v0.6.0. The Python tools run as local
# hooks through `uv run`, versioned by the mvp-shared[dev] bundle.
# ruff format replaces black; ruff's UP rules replace pyupgrade.

exclude: "^docs/|/migrations/|^tests/"
default_stages: [pre-commit]

repos:

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml

  # uv-lock rewrites uv.lock when pyproject.toml has moved on. The build
  # workflow's `uv sync --locked` fails on a stale lockfile, so running this
  # here means the lockfile is already correct by the time CI looks at it.
  - repo: https://github.com/astral-sh/uv-pre-commit
    rev: 0.12.18
    hooks:
      - id: uv-lock

  # Local hooks that use the project environment
  - repo: local
    hooks:
      - id: ruff
        name: ruff (lint)
        entry: uv run ruff check --fix
        language: system
        types: [python]
        require_serial: true
      - id: ruff-format
        name: ruff (format)
        entry: uv run ruff format
        language: system
        types: [python]
        require_serial: true
      - id: mypy
        name: mypy
        entry: uv run mypy
        language: system
        # Without require_serial, pre-commit splits the file list into parallel
        # batches, and concurrent mypy processes race on the shared .mypy_cache —
        # INTERNAL ERROR on a cold cache. One serial invocation is also what
        # mirrors-mypy ships.
        require_serial: true
        types: [python]
        files: ^licensing/
      - id: deptry
        name: deptry
        entry: uv run deptry .
        language: system
        pass_filenames: false
        always_run: true

# pre-commit.ci runs only the env-independent hooks; the local project-env hooks
# run in each repo's own CI (the shared build workflow's Code Quality job).
ci:
  autoupdate_schedule: monthly
  skip: [ruff, ruff-format, mypy, deptry]
  submodules: false
